# Builds the site and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: «GitHub Actions». The Pages URL (project page or custom domain) is
# read from the Pages settings at build time, so the same workflow serves
# https://<user>.github.io/<repo>/ and a custom domain at the root.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/laughing-pascal-y37ell]
    paths-ignore:
      - '**.md'
      - 'research/**'
      - 'scripts/fetch-source-site.mjs'
      - '.github/workflows/fetch-source-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read the Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build for the Pages URL
        run: npm run build
        env:
          # "/blik-site/" on a project page, "/" on a custom domain or a user site.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
